      <stop offset=".3" stop-color="#2b2016" stop-opacity="0"/>
      <stop offset=".82" stop-color="#2b2016" stop-opacity="0"/>
      <stop offset="1" stop-color="#140d08" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="vig" cx=".45" cy=".42" r=".75">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
